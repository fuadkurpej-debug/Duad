<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face { font-family: Anton; src: url(../../branding/Anton-Regular.ttf); }
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1920px; overflow:hidden; background:#0b0b0d; font-family:Anton, sans-serif; color:#fff; }
*, *::before, *::after { animation-play-state: paused !important; animation-fill-mode: both !important; }
.scene { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.glow { position:absolute; inset:0; background:radial-gradient(ellipse 70% 40% at 50% 55%, rgba(255,90,0,.35), transparent 70%); animation: glow 15s linear; }
@keyframes glow { 0%{opacity:.2} 20%{opacity:.8} 45%{opacity:.4} 75%{opacity:1} 100%{opacity:.6} }
.fire { background:linear-gradient(180deg,#ffe066,#ff7a00 60%,#e3170a); -webkit-background-clip:text; color:transparent; }

/* scene 1: 0-3s */
#s1 { animation: vis 15s linear; --a:0; --b:3; }
#s1 .l1 { font-size:190px; line-height:1; animation: slam .45s cubic-bezier(.2,1.6,.4,1) .15s; }
#s1 .l2 { font-size:190px; line-height:1; animation: slam .45s cubic-bezier(.2,1.6,.4,1) .7s; }
#s1 .l3 { font-size:150px; margin-top:30px; animation: slam .45s cubic-bezier(.2,1.6,.4,1) 1.3s; }
@keyframes slam { 0%{transform:scale(3);opacity:0} 100%{transform:scale(1);opacity:1} }

/* scene 2: 3-7.5s, caption style words */
#s2 { animation: v2 15s linear; padding:0 60px; }
@keyframes v2 { 0%,19.99%{opacity:0} 20%,49.99%{opacity:1} 50%,100%{opacity:0} }
.cap { font-size:130px; line-height:1.15; text-shadow:0 8px 0 #000, 0 0 30px rgba(0,0,0,.8); -webkit-text-stroke:6px #000; paint-order:stroke fill; }
.cap span { display:inline-block; opacity:0; animation: pop 3.2s linear; }
@keyframes pop { 0%{opacity:1;transform:scale(1.25);color:#ff7a00} 6%{transform:scale(1.1)} 14%{color:#ff7a00} 15%,100%{opacity:1;transform:scale(1);color:#fff} }

/* scene 3: 7.5-11s */
#s3 { animation: v3 15s linear; gap:40px; }
@keyframes v3 { 0%,49.99%{opacity:0} 50%,73.32%{opacity:1} 73.33%,100%{opacity:0} }
.row { font-size:150px; line-height:1; opacity:0; animation: slide .35s cubic-bezier(.2,1.3,.4,1); }
.row small { display:block; font-size:60px; color:#ffb36b; letter-spacing:6px; }
@keyframes slide { 0%{opacity:0;transform:translateX(-300px) skewX(-12deg)} 100%{opacity:1;transform:none} }

/* scene 4: 11-15s */
#s4 { animation: v4 15s linear; }
@keyframes v4 { 0%,73.32%{opacity:0} 73.33%,100%{opacity:1} }
#s4 svg { width:360px; animation: ignite .6s cubic-bezier(.2,1.5,.4,1) 11s, flick 1s ease-in-out 11.6s 4; filter:drop-shadow(0 0 60px rgba(255,110,0,.7)); }
@keyframes ignite { 0%{transform:scale(0) translateY(200px)} 100%{transform:scale(1)} }
@keyframes flick { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05,.97)} }
.name { font-size:170px; line-height:1; margin-top:30px; animation: slam .45s cubic-bezier(.2,1.6,.4,1) 11.4s; }
.name2 { font-size:92px; letter-spacing:34px; margin-right:-34px; animation: slam .45s cubic-bezier(.2,1.6,.4,1) 11.7s; }
.btn { margin-top:90px; background:#e3170a; border-radius:24px; padding:34px 70px; font-size:76px; letter-spacing:4px;
  box-shadow:0 0 0 0 rgba(255,122,0,.7); animation: slam .45s cubic-bezier(.2,1.6,.4,1) 12.3s, pulse 1s ease-out 12.8s 3; }
@keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(255,122,0,.8)} 100%{box-shadow:0 0 0 50px rgba(255,122,0,0)} }
.sub { margin-top:30px; font-size:48px; color:#ffb36b; letter-spacing:8px; animation: slam .45s ease 12.6s; }
@keyframes vis { 0%,19.99%{opacity:1} 20%,100%{opacity:0} }
</style></head><body>
<div class="glow"></div>

<div class="scene" id="s1">
  <div class="l1">STOP</div><div class="l2 fire">SCROLLING</div><div class="l3">🔥🔥🔥</div>
</div>

<div class="scene" id="s2"><div class="cap" id="cap"></div></div>

<div class="scene" id="s3">
  <div class="row" style="animation-delay:7.7s">CLIPPED.</div>
  <div class="row fire" style="animation-delay:8.5s">CAPTIONED.</div>
  <div class="row" style="animation-delay:9.3s">UNDER 60 SEC.<small>NO BORING PARTS</small></div>
</div>

<div class="scene" id="s4">
  <svg viewBox="0 0 100 130"><defs>
    <linearGradient id="o" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e3170a"/><stop offset=".55" stop-color="#ff7a00"/><stop offset="1" stop-color="#ffb000"/></linearGradient>
    <linearGradient id="i" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff9500"/><stop offset="1" stop-color="#ffe066"/></linearGradient></defs>
    <path fill="url(#o)" d="M50 0C58 25 86 42 86 80C86 108 69 128 50 128C31 128 14 108 14 82C14 60 27 48 33 30C38 47 43 53 48 56C45 36 43 18 50 0Z"/>
    <path fill="url(#i)" d="M50 52C55 66 70 76 70 96C70 112 61 122 50 122C39 122 30 112 30 98C30 86 37 80 40 70C43 80 46 83 49 84C47 74 46 62 50 52Z"/>
    <path fill="#0b0b0d" d="M43 88L61 100L43 112Z"/></svg>
  <div class="name fire">FUEGO</div><div class="name2">CLIPPING</div>
  <div class="btn">SUBSCRIBE</div>
  <div class="sub">NEW CLIPS EVERY DAY</div>
</div>

<script>
// scene 2: words pop one by one like Fuego captions
const words = "THE FUNNIEST MOMENTS ON THE INTERNET".split(" ");
const cap = document.getElementById("cap");
words.forEach((w, i) => {
  const s = document.createElement("span");
  s.textContent = w;
  s.style.animationDelay = (3.2 + i * 0.5) + "s";
  cap.append(s, " ");
});
// deterministic frame stepping for the renderer
window.seek = (t) => document.getAnimations().forEach(a => { a.currentTime = t * 1000; });
</script>
</body></html>
